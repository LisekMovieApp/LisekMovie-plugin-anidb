[package]
name = "lisek-plugin-anidb"
description = "aniDB (HTTP API) anime metadata provider extension for LisekMovie."
version = "1.0.0-beta"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/LisekMovieApp/LisekMovie-plugin-anidb"

[dependencies]
lisek-plugin-api = { path = "../LisekMovie-app/LisekMovie-Backend/lisek-plugin-api" }
async-trait = "0.1.89"
flate2 = "1.1"
quick-xml = "0.38"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["query"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
